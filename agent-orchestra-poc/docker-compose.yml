services:
  neo4j:
    image: neo4j:2026.09.0-enterprise
    container_name: orchestra-neo4j
    ports:
      - "17474:7474"
      - "17687:7687"
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-orchestra-dev-pw}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
      NEO4J_db_tx__log_rotation_retention__policy: "2 days"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#neo4j/} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
  init:
    image: neo4j:2026.09.0-enterprise
    profiles: [tools]
    depends_on:
      neo4j: {condition: service_healthy}
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-orchestra-dev-pw}
    volumes:
      - ./db:/db:ro
      - ./db/init:/init:ro
    entrypoint: ["/bin/bash", "/init/init.sh"]
  gateway:
    build: .
    profiles: [app]
    depends_on:
      neo4j: {condition: service_healthy}
    ports:
      - "18000:8000"
    env_file: [.env]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_GATEWAY_PASSWORD: ${NEO4J_GATEWAY_PASSWORD:-gateway-dev-pw}
      NEO4J_KGCURATOR_PASSWORD: ${NEO4J_KGCURATOR_PASSWORD:-kgcurator-dev-pw}
      ORCHESTRA_DATA_DIR: /data
    volumes:
      - .:/app
      - gateway-data:/data
    command: ["uvicorn", "--factory", "orchestra.gateway.app:create_app", "--host", "0.0.0.0", "--port", "8000"]
  cdc:
    build: .
    profiles: [app]
    depends_on:
      neo4j: {condition: service_healthy}
      gateway: {condition: service_started}
    ports:
      - "18001:8001"
    env_file: [.env]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_CDC_PASSWORD: ${NEO4J_CDC_PASSWORD:-cdc-dev-pw}
      GATEWAY_URL: http://gateway:8000
      CDC_DATA_DIR: /data
    volumes:
      - .:/app
      - cdc-data:/data
    command: ["uvicorn", "--factory", "orchestra.cdc.app:create_app", "--host", "0.0.0.0", "--port", "8001"]
  runtime:
    build: .
    profiles: [app]
    depends_on:
      gateway: {condition: service_started}
      cdc: {condition: service_started}
    env_file: [.env]
    environment:
      GATEWAY_URL: http://gateway:8000
      CDC_WS_URL: ws://cdc:8001
    volumes:
      - .:/app
    command: ["python", "-m", "orchestra.runtime"]
  tools:
    build: .
    profiles: [tools]
    depends_on:
      neo4j: {condition: service_healthy}
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_ADMIN_PASSWORD: ${NEO4J_ADMIN_PASSWORD:-admin-dev-pw}
      NEO4J_GATEWAY_PASSWORD: ${NEO4J_GATEWAY_PASSWORD:-gateway-dev-pw}
      NEO4J_CDC_PASSWORD: ${NEO4J_CDC_PASSWORD:-cdc-dev-pw}
    volumes:
      - .:/app
volumes:
  cdc-data:
  gateway-data:
  neo4j-data:
